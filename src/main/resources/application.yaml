server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: SimpleBalanceMCPClient
  thymeleaf:
    cache: false
  mvc:
    async:
      request-timeout: 300000
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      chat:
        options:
          model: llama-3.3-70b-versatile
    mcp:
      client:
        type: SYNC
        name: SimpleBalanceMCPClient
        version: 1.0.0
        initialized: false
        request-timeout: 30s
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            SimpleBalanceMCPServer:
              url: ${MCP_SERVER_URL:http://localhost:8082/mcp}

  # OAuth2 Client Credentials for MCP Server authentication
  security:
    oauth2:
      client:
        registration:
          mcp-client:
            client-id: ${CLIENT_ID:mcp-client}
            client-secret: ${CLIENT_SECRET:mcp-client-secret}
            authorization-grant-type: client_credentials
            scope: openid,profile,read,claudeai
            provider: mcp-client
        provider:
          mcp-client:
            token-uri: ${TOKEN_URL:http://localhost:9000/oauth2/token}

logging:
  level:
    com.app.simplebalancemcpclient: ${LOGGING_LEVEL:WARN}
    org.springframework.ai: ${LOGGING_LEVEL:WARN}
    io.modelcontextprotocol: ${LOGGING_LEVEL:WARN}
    org.springaicommunity: ${LOGGING_LEVEL:WARN}
    org.springframework.security.oauth2: ${LOGGING_LEVEL:WARN}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always